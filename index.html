<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de QR Code PIX</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --ink: #0a1f1c;
    --paper: #f0ebe0;
    --paper-2: #e6dfd0;
    --pix: #32bcad;      /* teal oficial do PIX */
    --pix-deep: #1a7a70;
    --line: #cdc4b0;
    --err: #b23a48;
    --radius: 4px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(10,31,28,0.06) 1px, transparent 0);
    background-size: 22px 22px;
  }

  .shell {
    width: 100%;
    max-width: 920px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    background: var(--paper-2);
    border: 1.5px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    border-radius: var(--radius);
    overflow: hidden;
  }

  /* ---- FORM SIDE ---- */
  .form-side { padding: 40px 36px; border-right: 1.5px solid var(--ink); }

  .eyebrow {
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--pix-deep);
    margin-bottom: 8px;
  }

  h1 {
    font-size: 30px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 28px;
  }
  h1 .accent { color: var(--pix-deep); }

  .field { margin-bottom: 18px; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin-bottom: 6px;
  }
  label .hint { font-weight: 400; color: #6b6357; }

  input, select {
    width: 100%;
    padding: 11px 12px;
    font-size: 14px;
    font-family: inherit;
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: var(--radius);
    color: var(--ink);
    transition: border-color .12s, box-shadow .12s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--pix-deep);
    box-shadow: 0 0 0 3px rgba(50,188,173,0.25);
  }
  input::placeholder { color: #9a9184; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .amount-wrap { position: relative; }
  .amount-wrap::before {
    content: 'R$';
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    font-size: 14px; font-weight: 600;
    color: #6b6357;
    pointer-events: none;
  }
  .amount-wrap input { padding-left: 38px; }

  .free-value {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: #6b6357;
    margin-top: 8px; cursor: pointer;
  }
  .free-value input { width: auto; accent-color: var(--pix-deep); }

  button.generate {
    width: 100%;
    margin-top: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    letter-spacing: 0.01em;
    color: var(--paper);
    background: var(--ink);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    transition: transform .08s, background .12s;
  }
  button.generate:hover { background: var(--pix-deep); }
  button.generate:active { transform: translateY(1px); }

  .err-msg {
    color: var(--err); font-size: 12px; margin-top: 10px;
    min-height: 16px; font-weight: 500;
  }

  /* ---- QR SIDE ---- */
  .qr-side {
    padding: 40px 36px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    background:
      repeating-linear-gradient(45deg, transparent, transparent 12px, rgba(10,31,28,0.025) 12px, rgba(10,31,28,0.025) 13px);
  }

  .qr-frame {
    width: 240px; height: 240px;
    background: #fff;
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    position: relative;
    box-shadow: 5px 5px 0 var(--ink);
  }
  .qr-frame canvas, .qr-frame img { display: block; }

  .qr-placeholder {
    font-family: ui-monospace, monospace;
    font-size: 12px; color: #9a9184;
    padding: 0 24px; line-height: 1.6;
  }
  .qr-placeholder .glyph { font-size: 40px; display: block; margin-bottom: 10px; opacity: .5; }

  .pix-badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: ui-monospace, monospace;
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--pix-deep); margin-top: 18px; font-weight: 600;
  }
  .pix-badge .dot { width: 8px; height: 8px; background: var(--pix); border-radius: 50%; }

  .payout-line {
    margin-top: 6px; font-size: 13px; font-weight: 700;
  }

  .copy-box { margin-top: 20px; width: 100%; display: none; }
  .copy-box.show { display: block; }
  .copy-field {
    display: flex; gap: 0;
    border: 1.5px solid var(--ink); border-radius: var(--radius);
    overflow: hidden;
  }
  .copy-field input {
    border: none; border-radius: 0;
    font-family: ui-monospace, monospace; font-size: 11px;
    background: #fff;
  }
  .copy-field input:focus { box-shadow: none; }
  .copy-field button {
    border: none; border-left: 1.5px solid var(--ink);
    background: var(--pix); color: var(--ink);
    padding: 0 16px; font-weight: 700; font-size: 12px;
    cursor: pointer; white-space: nowrap;
    font-family: inherit;
  }
  .copy-field button:hover { background: var(--pix-deep); color: #fff; }

  .download-link {
    margin-top: 12px; font-size: 12px; font-weight: 600;
    color: var(--pix-deep); text-decoration: none;
    border-bottom: 1.5px solid transparent; display: none;
  }
  .download-link.show { display: inline-block; }
  .download-link:hover { border-bottom-color: var(--pix-deep); }

  @media (max-width: 720px) {
    .shell { grid-template-columns: 1fr; box-shadow: 5px 5px 0 var(--ink); }
    .form-side { border-right: none; border-bottom: 1.5px solid var(--ink); }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <main class="shell">
    <section class="form-side">
      <div class="eyebrow">Pagamento instantâneo</div>
      <h1>Gerador de<br>QR Code <span class="accent">PIX</span></h1>

      <div class="field">
        <label for="chave">Chave PIX <span class="hint">— CPF, CNPJ, e-mail, telefone ou aleatória</span></label>
        <input id="chave" type="text" placeholder="fulano@email.com" autocomplete="off">
      </div>

      <div class="field">
        <label for="nome">Nome do recebedor <span class="hint">— máx. 25</span></label>
        <input id="nome" type="text" placeholder="Fulano de Tal" maxlength="25" autocomplete="off">
      </div>

      <div class="row">
        <div class="field">
          <label for="cidade">Cidade <span class="hint">— máx. 15</span></label>
          <input id="cidade" type="text" placeholder="Teresina" maxlength="15" autocomplete="off">
        </div>
        <div class="field">
          <label for="valor">Valor</label>
          <div class="amount-wrap">
            <input id="valor" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off">
          </div>
        </div>
      </div>

      <label class="free-value">
        <input id="livre" type="checkbox">
        Valor livre (pagador digita no app)
      </label>

      <div class="field" style="margin-top:18px;">
        <label for="txid">Identificador <span class="hint">— txid, opcional</span></label>
        <input id="txid" type="text" placeholder="PEDIDO12345" maxlength="25" autocomplete="off">
      </div>

      <button class="generate" id="btn">Gerar QR Code</button>
      <div class="err-msg" id="err"></div>
    </section>

    <section class="qr-side">
      <div class="qr-frame" id="frame">
        <div class="qr-placeholder" id="placeholder">
          <span class="glyph">▚</span>
          Preencha os dados<br>e gere o código
        </div>
      </div>

      <div class="pix-badge"><span class="dot"></span> br.gov.bcb.pix</div>
      <div class="payout-line" id="payout"></div>

      <a class="download-link" id="download" download="qrcode-pix.gif">↓ Baixar imagem</a>

      <div class="copy-box" id="copyBox">
        <div class="copy-field">
          <input id="brcode" type="text" readonly>
          <button id="copyBtn">Copiar</button>
        </div>
      </div>
    </section>
  </main>

<script>
// ---------- Payload EMV (BR Code) ----------
function emv(id, value) {
  const len = String(value.length).padStart(2, '0');
  return id + len + value;
}

function crc16(payload) {
  let crc = 0xFFFF;
  for (let i = 0; i < payload.length; i++) {
    crc ^= payload.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) {
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
      crc &= 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, '0');
}

function sanitize(s, max) {
  return s.normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-zA-Z0-9 ]/g, '')
    .toUpperCase()
    .slice(0, max)
    .trim();
}

function gerarPix({ chave, valor, nome, cidade, txid }) {
  const gui  = emv('00', 'br.gov.bcb.pix');
  const key  = emv('01', chave.trim());
  const merchantAccount = emv('26', gui + key);
  const additionalData  = emv('62', emv('05', sanitize(txid, 25) || '***'));

  let payload =
    emv('00', '01') +
    emv('01', '11') +
    merchantAccount +
    emv('52', '0000') +
    emv('53', '986') +
    (valor != null ? emv('54', valor.toFixed(2)) : '') +
    emv('58', 'BR') +
    emv('59', sanitize(nome, 25)) +
    emv('60', sanitize(cidade, 15)) +
    additionalData +
    '6304';

  return payload + crc16(payload);
}

// ---------- Valor parse (aceita 1.234,56 ou 1234.56) ----------
function parseValor(raw) {
  if (!raw) return null;
  const clean = raw.replace(/\./g, '').replace(',', '.').replace(/[^\d.]/g, '');
  const n = parseFloat(clean);
  return isFinite(n) && n > 0 ? n : null;
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const frame = $('frame');
const placeholder = $('placeholder');
const err = $('err');
const livre = $('livre');
const valorInput = $('valor');

livre.addEventListener('change', () => {
  valorInput.disabled = livre.checked;
  valorInput.style.opacity = livre.checked ? 0.4 : 1;
  if (livre.checked) valorInput.value = '';
});

$('btn').addEventListener('click', gerar);
document.querySelectorAll('input').forEach(el =>
  el.addEventListener('keydown', e => { if (e.key === 'Enter') gerar(); })
);

function gerar() {
  err.textContent = '';
  const chave  = $('chave').value.trim();
  const nome   = $('nome').value.trim();
  const cidade = $('cidade').value.trim();
  const txid   = $('txid').value.trim();
  const valor  = livre.checked ? null : parseValor(valorInput.value);

  if (!chave)  return fail('Informe a chave PIX.');
  if (!nome)   return fail('Informe o nome do recebedor.');
  if (!cidade) return fail('Informe a cidade.');
  if (!livre.checked && valor == null) return fail('Informe um valor válido ou marque "valor livre".');

  const brcode = gerarPix({ chave, valor, nome, cidade, txid });

  // render QR
  if (typeof qrcode !== 'function') {
    return fail('Biblioteca de QR não carregou. Verifique a conexão e recarregue.');
  }
  frame.querySelectorAll('canvas, img').forEach(n => n.remove());
  placeholder.style.display = 'none';

  const qr = qrcode(0, 'M');        // type 0 = auto version, error correction M
  qr.addData(brcode);
  qr.make();
  const img = document.createElement('img');
  img.src = qr.createDataURL(6, 8); // cellSize=6, margin=8px (quiet zone)
  img.width = 210; img.height = 210;
  img.alt = 'QR Code PIX';
  frame.appendChild(img);

  // payout line
  $('payout').textContent = valor != null
    ? 'R$ ' + valor.toFixed(2).replace('.', ',')
    : 'Valor a definir pelo pagador';

  // copy + download
  $('brcode').value = brcode;
  $('copyBox').classList.add('show');

  const link = $('download');
  link.href = img.src;
  link.classList.add('show');
}

function fail(msg) { err.textContent = msg; }

$('copyBtn').addEventListener('click', () => {
  const inp = $('brcode');
  inp.select();
  navigator.clipboard?.writeText(inp.value).then(() => {
    const b = $('copyBtn');
    b.textContent = 'Copiado!';
    setTimeout(() => b.textContent = 'Copiar', 1500);
  });
});
</script>
</body>
</html>
