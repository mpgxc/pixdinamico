name: APK Android

# O app usa geração nativa contínua: android/ não está versionado, é o
# `expo prebuild` que o produz. Então o pipeline parte sempre do zero, e o que
# ele constrói é exatamente o que o repositório descreve — sem projeto nativo
# ajustado à mão que ninguém consegue reproduzir.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Variante do Gradle'
        type: choice
        default: release
        options: [release, debug]
  push:
    tags: ['v*']

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # anexar o APK à Release quando o gatilho for uma tag

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # O NDK entra explícito porque o React Native compila o código nativo do
      # VisionCamera e do Nitro. Sem declarar, o Gradle o baixa sozinho (são
      # ~2,5GB) a cada execução, e a falha só apareceria no meio do build.
      - uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            cmake;3.22.1
            ndk;27.1.12297006

      # O Gradle recompila o código nativo do VisionCamera e do Nitro; sem cache
      # cada execução paga esse custo inteiro de novo.
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Os testes do pipeline e a checagem de worklets rodam antes de empacotar:
      # gerar um APK a partir de código que sabidamente falha é desperdício.
      - name: Testes e checagem de worklets
        run: npm test

      - name: Gerar o projeto nativo
        run: npx expo prebuild --platform android --no-install

      # Assinatura de verdade é opcional. Sem os segredos, o template do React
      # Native assina o release com a chave de debug — o APK instala e roda, mas
      # não serve para loja. Isso fica declarado no nome do arquivo e no resumo,
      # em vez de virar uma surpresa lá na frente.
      - name: Preparar assinatura
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            echo "::notice::Sem ANDROID_KEYSTORE_BASE64: o APK sairá assinado com a chave de debug."
            exit 0
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "signed=release" >> "$GITHUB_OUTPUT"

      - name: Construir o APK
        id: build
        env:
          VARIANT: ${{ inputs.variant || 'release' }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          task="assemble$(echo "${VARIANT:0:1}" | tr '[:lower:]' '[:upper:]')${VARIANT:1}"

          args=()
          if [ "$SIGNED" = "release" ]; then
            # API oficial do Android Gradle Plugin para assinar em CI, sem
            # editar o build.gradle que o prebuild acabou de gerar.
            args+=(
              "-Pandroid.injected.signing.store.file=$RUNNER_TEMP/release.jks"
              "-Pandroid.injected.signing.store.password=$STORE_PASSWORD"
              "-Pandroid.injected.signing.key.alias=$KEY_ALIAS"
              "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            )
          fi

          ./android/gradlew -p android "$task" --no-daemon "${args[@]}"

          apk=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "apk=$apk" >> "$GITHUB_OUTPUT"
          echo "name=qr-autozoom-${VARIANT}-${SIGNED}-signed-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Resumo
        env:
          APK: ${{ steps.build.outputs.apk }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          size=$(du -h "$APK" | cut -f1)
          {
            echo "## APK"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Arquivo | \`$(basename "$APK")\` |"
            echo "| Tamanho | $size |"
            echo "| Assinatura | \`$SIGNED\` |"
            if [ "$SIGNED" = "debug" ]; then
              echo
              echo '> Assinado com a chave de debug: instala e roda, mas **não** serve para publicação.'
              echo '> Para assinar de verdade, defina os segredos `ANDROID_KEYSTORE_BASE64`,'
              echo '> `ANDROID_KEYSTORE_PASSWORD`, `ANDROID_KEY_ALIAS` e `ANDROID_KEY_PASSWORD`.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.name }}
          path: mobile/${{ steps.build.outputs.apk }}
          if-no-files-found: error

      # Numa tag recém-criada a Release ainda não existe, e `upload` sozinho
      # falharia. Criar-se-ia sozinha só se alguém publicasse pela interface.
      - name: Publicar a Release com o APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.build.outputs.apk }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          set -euo pipefail
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            notes="APK Android de \`$GITHUB_REF_NAME\`."
            if [ "$SIGNED" = "debug" ]; then
              notes="$notes Assinado com a chave de debug — instala e roda, mas não serve para publicação em loja."
            fi
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "$notes"
          fi
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
