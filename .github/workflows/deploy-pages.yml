name: Deploy GitHub Pages

# Publica o site no GitHub Pages a cada push na main.
# Requer, uma única vez: Settings -> Pages -> Source = "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões mínimas exigidas pelo deploy oficial do Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante um único deploy por vez, sem cancelar um deploy em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate de qualidade: o deploy só acontece se os testes passarem.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes de regressão
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Sem bundler: monta o site apenas com os arquivos estáticos servidos,
      # deixando de fora testes, package.json e afins.
      - name: Preparar artefato do site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets src _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
